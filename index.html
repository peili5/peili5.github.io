];

const bodies=[
  {key:'mez',label:'美柔汀',sub:'月球軌道',angle:0.879,distF:0.28,color:'#c8c4b4',desc:'以金屬版面刮磨出的絨面光感，黑白之間捕捉最細膩的灰階過渡。',link:'guardians/'},

];

const allYears=[...new Set(exhibitions.map(e=>e.year))].sort((a,b)=>b-a);
const selEl=document.getElementById('year-sel');
allYears.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;selEl.appendChild(o);});
let filterYear='all';
selEl.addEventListener('change',e=>{filterYear=e.target.value==='all'?'all':+e.target.value;});

function buildGroups(yf){
  const m={};
  (yf==='all'?exhibitions:exhibitions.filter(e=>e.year===yf)).forEach(e=>{if(!COORDS[e.country])return;if(!m[e.country])m[e.country]={exh:[],aw:[],col:[],coords:COORDS[e.country]};m[e.country].exh.push(e);});
  (yf==='all'?awards:awards.filter(a=>a.year===yf)).forEach(a=>{if(!COORDS[a.country])return;if(!m[a.country])m[a.country]={exh:[],aw:[],col:[],coords:COORDS[a.country]};m[a.country].aw.push(a);});
  (yf==='all'?collections:collections.filter(c=>c.year===yf)).forEach(c=>{if(!COORDS[c.country])return;if(!m[c.country])m[c.country]={exh:[],aw:[],col:[],coords:COORDS[c.country]};m[c.country].col.push(c);});
  return m;
}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,cx,cy,R;
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  cx=W/2;cy=H/2;
  R=Math.min(W,H)*0.2;
}
resize();
window.addEventListener('resize',resize);

let rotY=0.3,rotX=0.12,drag=false,lx=0,ly=0,vy=0.004,vx=0;

function proj(lat,lon){
  const la=lat*Math.PI/180,lo=lon*Math.PI/180;
  let x=Math.cos(la)*Math.cos(lo);
  let y=Math.sin(la);
  let z=Math.cos(la)*Math.sin(lo);
  const x1=x*Math.cos(rotY)+z*Math.sin(rotY);
  const z1=-x*Math.sin(rotY)+z*Math.cos(rotY);
  const y2=y*Math.cos(rotX)-z1*Math.sin(rotX);
  const z2=y*Math.sin(rotX)+z1*Math.cos(rotX);
  return{sx:cx+x1*R, sy:cy-y2*R, z:z2};
}

function hexRgb(h){return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);}

let hitboxes=[];

function draw(){
  ctx.clearRect(0,0,W,H);
  hitboxes=[];

  // Space background
  ctx.fillStyle='#04060f';
  ctx.fillRect(0,0,W,H);

  // Stars (deterministic so no flicker)
  for(let i=0;i<350;i++){
    const sx=((Math.sin(i*127.3+1)*0.5+0.5)*W)|0;
    const sy=((Math.sin(i*319.7+2)*0.5+0.5)*H)|0;
    const a=0.1+Math.abs(Math.sin(i*73.1))*0.5;
    const r=0.3+Math.abs(Math.sin(i*41))*0.8;
    ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle='rgba(232,228,212,'+a+')';ctx.fill();
  }

  // Radial grid lines
  const maxDist=Math.min(W,H)*0.5;
  ctx.strokeStyle='rgba(232,228,212,0.03)';ctx.lineWidth=0.5;
  for(let a=0;a<Math.PI*2;a+=Math.PI/6){
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*R*1.08,cy+Math.sin(a)*R*1.08);
    ctx.lineTo(cx+Math.cos(a)*maxDist*0.92,cy+Math.sin(a)*maxDist*0.92);
    ctx.stroke();
  }
  for(let d=R*1.4;d<maxDist*0.95;d+=R*0.55){
    ctx.beginPath();ctx.arc(cx,cy,d,0,Math.PI*2);ctx.stroke();
  }

  // Celestial bodies
  const t=Date.now();
  bodies.forEach((b,bi)=>{
    const dist=Math.min(W,H)*b.distF*2.2;
    const bx=cx+Math.cos(b.angle)*dist;
    const by=cy+Math.sin(b.angle)*dist;
    const pulse=0.5+0.5*Math.sin(t*0.0014+bi*2.1);

    // Dashed line from earth edge
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(b.angle)*R*1.06,cy+Math.sin(b.angle)*R*1.06);
    ctx.lineTo(bx,by);
    ctx.strokeStyle='rgba('+hexRgb(b.color)+',0.15)';
    ctx.lineWidth=0.5;ctx.setLineDash([4,9]);ctx.stroke();ctx.setLineDash([]);

    // Body glow + circle
    ctx.shadowBlur=20;ctx.shadowColor=b.color;
    ctx.beginPath();ctx.arc(bx,by,8+pulse*3,0,Math.PI*2);
    ctx.fillStyle=b.color;ctx.fill();
    ctx.shadowBlur=0;

    // Label
    ctx.font='10px "Space Mono",monospace';
    ctx.fillStyle='rgba('+hexRgb(b.color)+',0.8)';
    ctx.textAlign=Math.cos(b.angle)>0?'left':'right';
    ctx.fillText(b.label,bx+Math.cos(b.angle)*17,by+Math.sin(b.angle)*14+4);
    ctx.restore();

    b._sx=bx;b._sy=by;
    hitboxes.push({type:'body',key:b.key,sx:bx,sy:by,r:18});
  });

  // Earth ocean
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle='#0d2a45';ctx.fill();

  // Continent polygons
  CONTINENTS.forEach(cont=>{
    const mid=cont.pts[Math.floor(cont.pts.length/2)];
    const mp=proj(mid[1],mid[0]);
    ctx.beginPath();
    cont.pts.forEach(([lon,lat],i)=>{
      const p=proj(lat,lon);
      i===0?ctx.moveTo(p.sx,p.sy):ctx.lineTo(p.sx,p.sy);
    });
    ctx.closePath();
    if(mp.z<=0){
      ctx.fillStyle='rgba(8,22,12,0.55)';ctx.fill();
    } else {
      ctx.fillStyle=mp.z>0.35?cont.c:'#112a16';ctx.fill();
      ctx.strokeStyle='rgba(50,100,55,0.2)';ctx.lineWidth=0.4;ctx.stroke();
    }
  });

  // Atmosphere rim
  const ag=ctx.createRadialGradient(cx,cy,R*0.93,cx,cy,R*1.07);
  ag.addColorStop(0,'rgba(70,120,255,0)');
  ag.addColorStop(1,'rgba(50,90,220,0.2)');
  ctx.beginPath();ctx.arc(cx,cy,R*1.07,0,Math.PI*2);
  ctx.fillStyle=ag;ctx.fill();

  // Sunlight highlight
  const sg=ctx.createRadialGradient(cx-R*0.3,cy-R*0.32,R*0.05,cx-R*0.3,cy-R*0.32,R*0.85);
  sg.addColorStop(0,'rgba(255,255,255,0.09)');
  sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle=sg;ctx.fill();

  // Dark side shadow
  const dg=ctx.createRadialGradient(cx+R*0.45,cy+R*0.38,R*0.1,cx+R*0.45,cy+R*0.38,R*1.15);
  dg.addColorStop(0,'rgba(2,4,10,0.6)');
  dg.addColorStop(1,'rgba(2,4,10,0)');
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fillStyle=dg;ctx.fill();

  // Globe edge
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(80,140,255,0.25)';ctx.lineWidth=1.2;ctx.stroke();

  // Exhibition markers
  const groups=buildGroups(filterYear);
  const ef=filterYear==='all'?exhibitions:exhibitions.filter(e=>e.year===filterYear);
  document.getElementById('s-exh').textContent=ef.length;
  document.getElementById('s-ctr').textContent=Object.keys(groups).length;

  Object.entries(groups).forEach(([country,g],gi)=>{
    const{lat,lon}=g.coords;
    const p=proj(lat,lon);
    if(p.z<0.04)return;
    const op=Math.min(1,p.z*1.8);
    const pulse=0.5+0.5*Math.sin(t*0.002+gi*1.3);
    const col=g.aw.length>0?'#e8c86a':g.col.length>0?'#9dd4b8':'#e8e4d4';

    ctx.save();ctx.globalAlpha=op;
    ctx.beginPath();ctx.arc(p.sx,p.sy,4+pulse*3.5,0,Math.PI*2);
    ctx.strokeStyle='rgba('+hexRgb(col)+','+(0.1+pulse*0.12)+')';
    ctx.lineWidth=0.5;ctx.stroke();
    ctx.beginPath();ctx.arc(p.sx,p.sy,3,0,Math.PI*2);
    ctx.fillStyle=col;ctx.fill();
    ctx.restore();
    hitboxes.push({type:'country',country,g,sx:p.sx,sy:p.sy,r:10});
  });

  // Auto-rotate
  if(!drag){
    rotY+=vy;rotX+=vx;vy*=0.992;vx*=0.97;
    if(Math.abs(vy)<0.0008)vy=0.0008;
    rotX=Math.max(-0.45,Math.min(0.45,rotX));
  }

  requestAnimationFrame(draw);
}

// Mouse interaction
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;vy=0;vx=0;});
canvas.addEventListener('mousemove',e=>{
  if(!drag){
    const h=hitboxes.find(h=>Math.hypot(e.clientX-h.sx,e.clientY-h.sy)<h.r);
    canvas.style.cursor=h?'pointer':'default';return;
  }
  const dx=e.clientX-lx,dy=e.clientY-ly;
  rotY+=dx*0.006;rotX+=dy*0.004;
  rotX=Math.max(-0.45,Math.min(0.45,rotX));
  vy=dx*0.004;vx=dy*0.003;
  lx=e.clientX;ly=e.clientY;
});
canvas.addEventListener('mouseup',()=>drag=false);
canvas.addEventListener('mouseleave',()=>drag=false);
canvas.addEventListener('touchstart',e=>{drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;vy=0;e.preventDefault();},{passive:false});
canvas.addEventListener('touchmove',e=>{if(!drag)return;const dx=e.touches[0].clientX-lx;rotY+=dx*0.006;vy=dx*0.004;lx=e.touches[0].clientX;e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',()=>drag=false);
canvas.addEventListener('click',e=>{
  const h=hitboxes.find(h=>Math.hypot(e.clientX-h.sx,e.clientY-h.sy)<h.r);
  if(!h){closePanel();return;}
  h.type==='body'?showBody(bodies.find(b=>b.key===h.key)):showCountry(h.country,h.g);
});

function closePanel(){document.getElementById('po').classList.remove('on');}
document.getElementById('po').addEventListener('click',e=>{if(e.target===document.getElementById('po'))closePanel();});

function showBody(b){
  document.getElementById('pc').innerHTML='<div class="ph"><div><div class="ph-meta" style="color:'+b.color+'">'+b.sub+'</div><div class="ph-title">'+b.label+'</div></div><button class="pclose" onclick="closePanel()">&#215;</button></div><div class="pb"><div class="sdesc">'+b.desc+'</div><a class="slink" href="'+b.link+'" style="color:'+b.color+';border:0.5px solid '+b.color+'55">進入完整系列 &#8594;</a></div>';
  document.getElementById('po').classList.add('on');
}

function showCountry(country,g){
  const by={};
  g.exh.forEach(e=>{if(!by[e.year])by[e.year]=[];by[e.year].push({t:'exh',d:e});});
  g.aw.forEach(a=>{if(!by[a.year])by[a.year]=[];by[a.year].push({t:'aw',d:a});});
  g.col.forEach(c=>{if(!by[c.year])by[c.year]=[];by[c.year].push({t:'col',d:c});});
  const yrs=Object.keys(by).sort((a,b)=>b-a);
  const total=g.exh.length+g.aw.length+g.col.length;
  const fl={'Germany':'🇩🇪','Taiwan':'🇹🇼','Serbia':'🇷🇸','Latvia':'🇱🇻','Poland':'🇵🇱','Bulgaria':'🇧🇬','France':'🇫🇷','Mexico':'🇲🇽','Italy':'🇮🇹','Belgium':'🇧🇪','Romania':'🇷🇴','Armenia':'🇦🇲','USA':'🇺🇸','North Macedonia':'🇲🇰','Hong Kong':'🇭🇰','Russia':'🇷🇺','Bangladesh':'🇧🇩','Japan':'🇯🇵','Spain':'🇪🇸','Argentina':'🇦🇷','India':'🇮🇳','Brazil':'🇧🇷','Albania':'🇦🇱'};
  let rows=yrs.map(yr=>'<div class="yrg"><div class="yrl">'+yr+'</div>'+by[yr].map(i=>{
    if(i.t==='exh')return'<div class="er"><span class="es" style="color:rgba(232,228,212,0.4)">&#9679;</span><span class="en">'+i.d.name+(i.d.note?' <em style="opacity:.5">('+i.d.note+')</em>':'')+'</span><span class="eb bx">展覽</span></div>';
    if(i.t==='aw')return'<div class="er"><span class="es" style="color:#e8c86a">&#9733;</span><span class="en">'+i.d.award+'<br><span style="font-size:11px;opacity:.55">'+i.d.event+'</span></span><span class="eb ba">獲獎</span></div>';
    return'<div class="er"><span class="es" style="color:#9dd4b8">&#9670;</span><span class="en">'+i.d.institution+'</span><span class="eb bc">典藏</span></div>';
  }).join('')+'</div>').join('');
  document.getElementById('pc').innerHTML='<div class="ph"><div><div class="ph-meta">'+(fl[country]||'')+' '+total+' 筆紀錄</div><div class="ph-title">'+country+'</div></div><button class="pclose" onclick="closePanel()">&#215;</button></div><div class="pb">'+rows+'</div>';
  document.getElementById('po').classList.add('on');
}

draw();
</script>
</body>
</html>
