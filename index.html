<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peili Huang — Portfolio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Space+Mono&display=swap');
:root{--space:#04060f;--star:#e8e4d4;--muted:rgba(232,228,212,0.35);--mez:#c8c4b4;--crb:#c8853a;--pol:#7a9ab8;--award:#e8c86a;--collect:#9dd4b8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--space);color:var(--star);font-family:'Cormorant Garamond',serif;height:100vh;overflow:hidden;}
canvas{display:block;position:absolute;top:0;left:0;}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.corner-name{position:absolute;top:28px;left:36px;font-size:12px;font-family:'Space Mono',monospace;letter-spacing:.08em;color:var(--muted);}
.legend{position:absolute;bottom:32px;left:36px;display:flex;flex-direction:column;gap:7px;}
.leg{display:flex;align-items:center;gap:9px;font-size:10px;font-family:'Space Mono',monospace;color:rgba(232,228,212,0.38);letter-spacing:.04em;}
.ldot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.lstar{font-size:9px;line-height:1;flex-shrink:0;}
.hint{position:absolute;bottom:32px;right:36px;font-size:10px;font-family:'Space Mono',monospace;color:rgba(232,228,212,0.18);text-align:right;line-height:1.8;}
.stats{position:absolute;top:28px;right:36px;display:flex;gap:20px;}
.stat{text-align:right;}
.stat-n{font-size:20px;font-weight:300;color:var(--star);line-height:1;}
.stat-l{font-size:9px;font-family:'Space Mono',monospace;color:rgba(232,228,212,0.28);letter-spacing:.06em;margin-top:2px;}

/* year filter */
.year-bar{position:absolute;top:72px;left:36px;display:flex;align-items:center;gap:10px;pointer-events:all;}
.year-bar label{font-size:10px;font-family:'Space Mono',monospace;color:rgba(232,228,212,0.3);letter-spacing:.06em;}
#year-sel{background:transparent;border:0.5px solid rgba(232,228,212,0.15);color:rgba(232,228,212,0.6);font-family:'Space Mono',monospace;font-size:10px;padding:4px 8px;border-radius:4px;cursor:pointer;outline:none;}
#year-sel option{background:#0c0f1e;color:#e8e4d4;}

/* overlay */
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(4,6,15,0.72);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;}
#overlay.on{opacity:1;pointer-events:all;}
.panel{background:#0c0f1e;border:0.5px solid rgba(232,228,212,0.13);border-radius:12px;width:460px;max-width:92vw;max-height:82vh;overflow-y:auto;transform:translateY(12px);transition:transform .25s;}
#overlay.on .panel{transform:translateY(0);}
.ph{padding:20px 24px 14px;border-bottom:0.5px solid rgba(232,228,212,0.07);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:#0c0f1e;z-index:1;}
.ph-meta{font-size:10px;font-family:'Space Mono',monospace;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;}
.ph-title{font-size:22px;font-weight:300;line-height:1.2;}
.pclose{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;font-family:'Space Mono',monospace;padding:0;line-height:1;flex-shrink:0;}
.pclose:hover{color:var(--star);}
.pb{padding:16px 24px 22px;}

/* series panel */
.series-desc{font-size:14px;font-style:italic;color:rgba(232,228,212,0.5);line-height:1.75;margin-bottom:16px;}
.work-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;}
.work-ph{aspect-ratio:3/4;border-radius:5px;background:rgba(232,228,212,0.04);border:0.5px solid rgba(232,228,212,0.09);display:flex;align-items:center;justify-content:center;font-size:9px;font-family:'Space Mono',monospace;color:rgba(232,228,212,0.2);text-align:center;padding:6px;line-height:1.5;}

/* country panel */
.yr-group{margin-bottom:14px;}
.yr-label{font-size:10px;font-family:'Space Mono',monospace;color:rgba(232,228,212,0.28);letter-spacing:.08em;margin-bottom:6px;padding-bottom:4px;border-bottom:0.5px solid rgba(232,228,212,0.06);}
.entry-row{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:0.5px solid rgba(232,228,212,0.04);}
.entry-sym{font-size:10px;flex-shrink:0;width:14px;}
.entry-name{font-size:13px;color:rgba(232,228,212,0.75);line-height:1.4;flex:1;}
.entry-badge{font-size:9px;font-family:'Space Mono',monospace;padding:2px 6px;border-radius:3px;flex-shrink:0;}
.badge-award{background:rgba(232,200,106,0.12);color:var(--award);}
.badge-collect{background:rgba(157,212,184,0.12);color:var(--collect);}
.badge-exh{background:rgba(232,228,212,0.07);color:rgba(232,228,212,0.35);}
.p-flag{font-size:11px;font-family:'Space Mono',monospace;color:rgba(232,228,212,0.22);margin-bottom:14px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="corner-name">Peili Huang</div>
  <div class="stats">
    <div class="stat"><div class="stat-n" id="s-exh">45</div><div class="stat-l">EXHIBITIONS</div></div>
    <div class="stat"><div class="stat-n" id="s-ctr">23</div><div class="stat-l">COUNTRIES</div></div>
    <div class="stat"><div class="stat-n">2017</div><div class="stat-l">SINCE</div></div>
  </div>
  <div class="year-bar">
    <label>YEAR</label>
    <select id="year-sel"><option value="all">ALL</option></select>
  </div>
  <div class="legend">
    <div class="leg"><div class="ldot" style="background:var(--star)"></div>展覽</div>
    <div class="leg"><span class="lstar" style="color:var(--award)">★</span>獲獎</div>
    <div class="leg"><span class="lstar" style="color:var(--collect)">◆</span>典藏</div>
    <div class="leg"><div class="ldot" style="background:var(--mez)"></div>美柔汀 — 月球軌道</div>
    <div class="leg"><div class="ldot" style="background:var(--pol)"></div>Polyester 版 — 水星軌道</div>
    <div class="leg"><div class="ldot" style="background:var(--crb)"></div>金剛砂 — 太陽距離</div>
  </div>
  <div class="hint">拖曳旋轉地球<br>點擊地點或天體</div>
</div>
<div id="overlay"><div class="panel" id="panel"></div></div>

<script>
// ── DATA ────────────────────────────────────────────────────

  'Poland':{lat:51.92,lon:19.15},'Bulgaria':{lat:42.73,lon:25.49},
  'France':{lat:46.23,lon:2.21},'Mexico':{lat:23.63,lon:-102.55},
  'Italy':{lat:41.87,lon:12.57},'Belgium':{lat:50.50,lon:4.47},
  'Romania':{lat:45.94,lon:24.97},'Armenia':{lat:40.07,lon:45.04},
  'USA':{lat:37.09,lon:-95.71},'North Macedonia':{lat:41.61,lon:21.75},
  'Hong Kong':{lat:22.32,lon:114.17},'Russia':{lat:61.52,lon:105.32},
  'Bangladesh':{lat:23.68,lon:90.36},'Japan':{lat:36.20,lon:138.25},
  'Spain':{lat:40.46,lon:-3.75},'Argentina':{lat:-38.42,lon:-63.62},

const exhibitions=[

  {year:2023,name:'22nd International Print Biennial Varna',country:'Bulgaria',city:'Varna'},

  {year:2020,name:'Biennale di Grafica Contemporanea — Continuità VI',country:'Italy'},
  {year:2020,name:'Biennale of Contemporary Graphic Art — Diego Donati Prize',country:'Italy'},
  {year:2020,name:'International Miniature Art Fest',country:'Bangladesh'},
  {year:2020,name:'The 2nd TKO International Mini Print Exhibition',country:'Japan'},
  {year:2020,name:'6th ON Paper International Printmaking Award',country:'Spain'},
  {year:2020,name:'BIGAI 1st International Biennial of Engraving and Printed Art',country:'Argentina'},
  {year:2020,name:'WorldWide Prints Project',country:'Italy'},
  {year:2020,name:"11th la Triennale Mondiale de l'Estampe",country:'France'},
  {year:2020,name:'Biennale Internationale du Carton Gravé',country:'France'},
  {year:2020,name:'IPC International Mini Print Exhibition',country:'Taiwan'},
  {year:2019,name:'Ural Print Triennial',country:'Russia',city:'Yekaterinburg'},

  {year:2018,name:'3rd Bienal Internacional de MiniPrint',country:'Argentina'},
  {year:2018,name:'38th Mini Print International of Cadaques',country:'Spain',city:'Cadaques'},
  {year:2017,name:'Awagami International Mini Print Exhibition',country:'Japan'},

const awards=[
  {year:2024,award:'Second Prize / Dynamic Group',event:'Like Water NFT Art Award',country:'Taiwan'},
  {year:2021,award:'Finalist (Top 25)',event:"5th Rene Carcan Prix Int'l de Gravure",country:'Belgium'},
  {year:2021,award:'Notable Recognition for Excellence',event:'2nd Annual Juried FPG Print Exhibition',country:'USA'},
  {year:2018,award:'Winner',event:'38th Mini Print International of Cadaques',country:'Spain'},
  {year:2017,award:'Honorable Mention',event:"Awagami Int'l Mini Print Exhibition",country:'Japan'},
];

const collections=[
  {year:2024,institution:'Rothko Museum',country:'Latvia',city:'Daugavpils'},
  {year:2023,institution:'Tirana Art Gallery Museum',country:'Albania',city:'Tirana'},
  {year:2022,institution:'Muzeum Miasta Ostrowa Wielkopolskiego',country:'Poland'},
  {year:2021,institution:'KulturDialog Armenien Organization',country:'Armenia'},
  {year:2020,institution:'International Printmaking Center (IPC)',country:'Taiwan'},
  {year:2019,institution:'Mesa Contemporary Arts Museum (Print Calendar 2019–2023)',country:'USA'},
  {year:2019,institution:'Bashkir Nesterov State Art Museum',country:'Russia'},
  {year:2019,institution:'Ekaterinburg Museum of Fine Arts',country:'Russia',city:'Yekaterinburg'},
  {year:2018,institution:'National Library of Catalonia',country:'Spain'},
];

const bodies=[
  {key:'mez',label:'美柔汀',sub:'月球軌道',dist:0.22,color:'#c8c4b4',
   desc:'以金屬版面刮磨出的絨面光感，黑白之間捕捉最細膩的灰階過渡。',works:['作品一','作品二','作品三']},
  {key:'pol',label:'Polyester 版',sub:'水星軌道',dist:0.31,color:'#7a9ab8',
   desc:'透明版材的平面延展，線條在黑白之間構築靜默的幾何空間。',works:['作品一','作品二','作品三']},
  {key:'crb',label:'金剛砂',sub:'太陽距離',dist:0.48,color:'#c8853a',
   desc:'砂粒咬合色彩的方式，讓每張印刷都帶有地質般的粗粒質地與鮮明彩度。',works:['作品一','作品二','作品三']},
];
bodies[0].angle=Math.PI*0.28;
bodies[1].angle=Math.PI*1.15;
bodies[2].angle=Math.PI*1.72;

// ── YEAR FILTER ──────────────────────────────────────────
const allYears=[...new Set(exhibitions.map(e=>e.year))].sort((a,b)=>b-a);
const sel=document.getElementById('year-sel');
allYears.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;sel.appendChild(o);});
let filterYear='all';
sel.addEventListener('change',e=>{filterYear=e.target.value==='all'?'all':+e.target.value;});

// ── CANVAS ───────────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,cx,cy;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;cx=W/2;cy=H/2;}
resize();window.addEventListener('resize',resize);

const stars=Array.from({length:340},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.1+0.2,a:Math.random()*0.55+0.12}));

let earthRot=0,dragging=false,lastMX=0,velX=0.0007;

// Build country groups
function buildCountryGroups(yearF){
  const map={};
  const exhF=yearF==='all'?exhibitions:exhibitions.filter(e=>e.year===yearF);
  exhF.forEach(e=>{
    if(!COORDS[e.country])return;
    if(!map[e.country])map[e.country]={exh:[],aw:[],col:[],coords:COORDS[e.country]};
    map[e.country].exh.push(e);
  });
  const awF=yearF==='all'?awards:awards.filter(a=>a.year===yearF);
  awF.forEach(a=>{
    if(!COORDS[a.country])return;
    if(!map[a.country])map[a.country]={exh:[],aw:[],col:[],coords:COORDS[a.country]};
    map[a.country].aw.push(a);
  });
  const colF=yearF==='all'?collections:collections.filter(c=>c.year===yearF);
  colF.forEach(c=>{
    if(!COORDS[c.country])return;
    if(!map[c.country])map[c.country]={exh:[],aw:[],col:[],coords:COORDS[c.country]};
    map[c.country].col.push(c);
  });
  return map;
}

function hexRgb(h){return`${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`;}

function latLonXYZ(lat,lon,rot,r){
  const phi=(90-lat)*Math.PI/180;
  const lam=lon*Math.PI/180+rot;
  return{x:r*Math.sin(phi)*Math.sin(lam),y:-r*Math.cos(phi),z:r*Math.sin(phi)*Math.cos(lam)};
}

let hitboxes=[];

function drawGrid(r){
  ctx.save();
  ctx.strokeStyle='rgba(232,228,212,0.035)';
  ctx.lineWidth=0.5;
  for(let a=0;a<Math.PI*2;a+=Math.PI/6){
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r*0.16,cy+Math.sin(a)*r*0.16);
    ctx.lineTo(cx+Math.cos(a)*r*0.64,cy+Math.sin(a)*r*0.64);ctx.stroke();
  }
  for(let d=0.18;d<=0.64;d+=0.115){
    ctx.beginPath();ctx.arc(cx,cy,r*d,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

function drawEarth(r,rot){
  ctx.save();ctx.translate(cx,cy);
  ctx.shadowBlur=30;ctx.shadowColor='rgba(90,150,220,0.16)';
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle='#0d2a45';ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.clip();ctx.rotate(rot);
  const lc='#1a4a2e';
  [[-10,-14,26,20],[20,-7,24,32],[-44,-12,20,28],[30,24,22,14]].forEach(([x,y,w,h])=>{
    ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,Math.PI*2);ctx.fillStyle=lc;ctx.fill();
  });
  ctx.restore();
  ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(100,160,255,0.2)';ctx.lineWidth=2.5;ctx.stroke();
  ctx.setLineDash([2,5]);ctx.strokeStyle='rgba(232,228,212,0.1)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
}

function drawMarkers(earthR,rot){
  const groups=buildCountryGroups(filterYear);
  Object.entries(groups).forEach(([country,g],gi)=>{
    const{lat,lon}=g.coords;
    const p=latLonXYZ(lat,lon,rot,earthR*0.94);
    if(p.z<0)return;
    const sx=cx+p.x,sy=cy+p.y;
    const t=Date.now()*0.002+gi*1.1;
    const pulse=0.5+0.5*Math.sin(t);

    // determine dominant type for color
    const hasAward=g.aw.length>0,hasCol=g.col.length>0;
    const dotColor=hasAward?'#e8c86a':hasCol?'#9dd4b8':'#e8e4d4';

    ctx.save();
    // pulse ring
    ctx.beginPath();ctx.arc(sx,sy,4+pulse*3.5,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${hexRgb(dotColor)},${0.07+pulse*0.09})`;
    ctx.lineWidth=0.5;ctx.stroke();

    if(hasAward){
      // star shape
      ctx.fillStyle='#e8c86a';
      drawStar(sx,sy,3.5,6,0);
    } else if(hasCol){
      // diamond
      ctx.fillStyle='#9dd4b8';
      drawDiamond(sx,sy,4.5);
    } else {
      ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);
      ctx.fillStyle='#e8e4d4';ctx.fill();
    }

    // if country has multiple types, draw small secondary symbol offset
    if(hasAward&&g.exh.length>0){
      ctx.beginPath();ctx.arc(sx+6,sy-4,2,0,Math.PI*2);ctx.fillStyle='rgba(232,228,212,0.5)';ctx.fill();
    }
    ctx.restore();

    const total=g.exh.length+g.aw.length+g.col.length;
    if(total>1){
      ctx.save();ctx.font='9px Space Mono, monospace';ctx.fillStyle='rgba(232,228,212,0.35)';
      ctx.textAlign='center';ctx.fillText(total,sx,sy-8);ctx.restore();
    }

    hitboxes.push({type:'country',country,g,sx,sy,r:11});
  });
}

function drawStar(x,y,r,points,rot){
  ctx.beginPath();
  for(let i=0;i<points*2;i++){
    const a=i*Math.PI/points+rot;
    const cr=i%2===0?r:r*0.45;
    i===0?ctx.moveTo(x+Math.cos(a)*cr,y+Math.sin(a)*cr):ctx.lineTo(x+Math.cos(a)*cr,y+Math.sin(a)*cr);
  }
  ctx.closePath();ctx.fill();
}
function drawDiamond(x,y,r){
  ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r*0.7,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r*0.7,y);ctx.closePath();ctx.fill();
}

function drawBody(b,baseR){
  const dist=baseR*(b.dist*2.2+0.18);
  const x=cx+Math.cos(b.angle)*dist,y=cy+Math.sin(b.angle)*dist;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx+Math.cos(b.angle)*baseR*1.05,cy+Math.sin(b.angle)*baseR*1.05);
  ctx.lineTo(x,y);
  ctx.strokeStyle=`rgba(${hexRgb(b.color)},0.1)`;ctx.lineWidth=0.5;ctx.setLineDash([4,8]);ctx.stroke();
  ctx.setLineDash([]);
  const pulse=0.5+0.5*Math.sin(Date.now()*0.0014+bodies.indexOf(b)*2);
  ctx.shadowBlur=22;ctx.shadowColor=b.color;
  ctx.beginPath();ctx.arc(x,y,10+pulse*2.5,0,Math.PI*2);ctx.fillStyle=b.color;ctx.fill();
  ctx.shadowBlur=0;
  ctx.font='10px Space Mono, monospace';ctx.fillStyle=`rgba(${hexRgb(b.color)},0.65)`;
  ctx.textAlign=Math.cos(b.angle)>0?'left':'right';
  const lx=x+Math.cos(b.angle)*18,ly=y+Math.sin(b.angle)*16;
  ctx.fillText(b.label,lx,ly);
  ctx.restore();
  b._sx=x;b._sy=y;
  hitboxes.push({type:'body',key:b.key,sx:x,sy:y,r:16});
}

function draw(){
  ctx.clearRect(0,0,W,H);
  hitboxes=[];
  stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(232,228,212,${s.a})`;ctx.fill();});
  const er=Math.min(W,H)*0.115;
  drawGrid(Math.min(W,H)*0.56);
  bodies.forEach(b=>drawBody(b,er));
  drawEarth(er,earthRot);
  drawMarkers(er,earthRot);
  if(!dragging)earthRot+=velX;
  requestAnimationFrame(draw);
}

// ── INTERACTION ──────────────────────────────────────────
canvas.addEventListener('mousedown',e=>{dragging=true;lastMX=e.clientX;velX=0;});
canvas.addEventListener('mousemove',e=>{
  if(!dragging){
    const h=hitboxes.find(h=>Math.hypot(e.clientX-h.sx,e.clientY-h.sy)<h.r);
    canvas.style.cursor=h?'pointer':'default';return;
  }
  const dx=e.clientX-lastMX;earthRot+=dx*0.007;velX=dx*0.007*0.55;lastMX=e.clientX;
});
canvas.addEventListener('mouseup',()=>dragging=false);
canvas.addEventListener('mouseleave',()=>dragging=false);
canvas.addEventListener('click',e=>{
  const h=hitboxes.find(h=>Math.hypot(e.clientX-h.sx,e.clientY-h.sy)<h.r);
  if(!h){closePanel();return;}
  h.type==='body'?showBody(bodies.find(b=>b.key===h.key)):showCountry(h.country,h.g);
});
canvas.addEventListener('touchstart',e=>{dragging=true;lastMX=e.touches[0].clientX;velX=0;e.preventDefault();},{passive:false});
canvas.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-lastMX;earthRot+=dx*0.007;velX=dx*0.007*0.55;lastMX=e.touches[0].clientX;e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',()=>dragging=false);

document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closePanel();});

// ── PANELS ───────────────────────────────────────────────
function closePanel(){document.getElementById('overlay').classList.remove('on');}

function showBody(b){
  document.getElementById('panel').innerHTML=`
    <div class="ph">
      <div><div class="ph-meta" style="color:${b.color}">${b.sub}</div><div class="ph-title">${b.label}</div></div>
      <button class="pclose" onclick="closePanel()">×</button>
    </div>
    <div class="pb">
      <div class="series-desc">${b.desc}</div>
      <div class="work-grid">${b.works.map(w=>`<div class="work-ph">${w}<br><span style="color:${b.color};opacity:.6">▣</span></div>`).join('')}</div>
      <div style="font-size:11px;font-family:'Space Mono',monospace;color:rgba(232,228,212,0.22)">→ <a href='../star-atlas/' style='color:inherit'>進入完整系列</a></div>
    </div>`;
  document.getElementById('overlay').classList.add('on');
}

function showCountry(country,g){
  // Group everything by year
  const byYear={};
  g.exh.forEach(e=>{if(!byYear[e.year])byYear[e.year]=[];byYear[e.year].push({type:'exh',data:e});});
  g.aw.forEach(a=>{if(!byYear[a.year])byYear[a.year]=[];byYear[a.year].push({type:'award',data:a});});
  g.col.forEach(c=>{if(!byYear[c.year])byYear[c.year]=[];byYear[c.year].push({type:'collect',data:c});});
  const years=Object.keys(byYear).sort((a,b)=>b-a);

  const total=g.exh.length+g.aw.length+g.col.length;
  const flag=countryFlag(country);

  const rows=years.map(yr=>`
    <div class="yr-group">
      <div class="yr-label">${yr}</div>
      ${byYear[yr].map(item=>{
        if(item.type==='exh')return`<div class="entry-row"><span class="entry-sym" style="color:rgba(232,228,212,0.4)">●</span><span class="entry-name">${item.data.name}${item.data.note?` <em style="opacity:.5">(${item.data.note})</em>`:''}</span><span class="entry-badge badge-exh">展覽</span></div>`;
        if(item.type==='award')return`<div class="entry-row"><span class="entry-sym" style="color:var(--award)">★</span><span class="entry-name">${item.data.award}<br><span style="font-size:11px;opacity:.55">${item.data.event}</span></span><span class="entry-badge badge-award">獲獎</span></div>`;
        return`<div class="entry-row"><span class="entry-sym" style="color:var(--collect)">◆</span><span class="entry-name">${item.data.institution}</span><span class="entry-badge badge-collect">典藏</span></div>`;
      }).join('')}
    </div>`).join('');

  document.getElementById('panel').innerHTML=`
    <div class="ph">
      <div><div class="ph-meta">${flag} ${total} 筆紀錄</div><div class="ph-title">${country}</div></div>
      <button class="pclose" onclick="closePanel()">×</button>
    </div>
    <div class="pb">${rows}</div>`;
  document.getElementById('overlay').classList.add('on');
}

function countryFlag(c){
  const f={'Germany':'🇩🇪','Taiwan':'🇹🇼','Serbia':'🇷🇸','Latvia':'🇱🇻','Poland':'🇵🇱','Bulgaria':'🇧🇬',
    'France':'🇫🇷','Mexico':'🇲🇽','Italy':'🇮🇹','Belgium':'🇧🇪','Romania':'🇷🇴','Armenia':'🇦🇲',
    'USA':'🇺🇸','North Macedonia':'🇲🇰','Hong Kong':'🇭🇰','Russia':'🇷🇺','Bangladesh':'🇧🇩',
    'Japan':'🇯🇵','Spain':'🇪🇸','Argentina':'🇦🇷','India':'🇮🇳','Brazil':'🇧🇷','Albania':'🇦🇱'};
  return f[c]||'';
}

// update stats display
function updateStats(){
  const groups=buildCountryGroups(filterYear);
  const exhCount=filterYear==='all'?exhibitions.length:exhibitions.filter(e=>e.year===filterYear).length;
  document.getElementById('s-exh').textContent=exhCount;
  document.getElementById('s-ctr').textContent=Object.keys(groups).length;
}
setInterval(updateStats,200);

draw();
</script>
